
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Performance Prediction</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="container">
        <h1>Student Performance Prediction</h1>
        <p>Enter student details below</p>

        <label for="name">Student Name</label>
        <input type="text" id="name" placeholder="Enter your name" required>

        <label for="hours">Study Hours</label>
        <input type="number" id="hours" min="0" max="24" step="0.5" required>

        <label for="marks">Previous Marks</label>
        <input type="number" id="marks" min="0" max="100" required>

        <label for="attendance">Attendance (%)</label>
        <input type="number" id="attendance" min="0" max="100" required>

        <button type="button" onclick="predict()">Predict Performance</button>

        <div id="result">
            <h2>Prediction Result</h2>
            <p id="output"></p>
        </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
